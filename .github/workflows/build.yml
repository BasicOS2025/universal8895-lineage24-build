name: Experimental LineageOS 24 ROM for Galaxy S8
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dreamlte-lineage24-rom
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runner
        timeout-minutes: 15
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y bc bison build-essential ccache curl flex libc6-dev-i386 lib32stdc++-11-dev git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzop pngcrush python3 rsync schedtool squashfs-tools xsltproc zip zlib1g-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler libfdt-dev btrfs-progs
          sudo curl -fsSL --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod 755 /usr/local/bin/repo
          git config --global user.name BasicOS2025
          git config --global user.email 215494682+BasicOS2025@users.noreply.github.com
          git config --global gc.auto 0
          df -h
      - name: Prepare compressed disposable build storage
        run: bash ci/prepare-storage.sh
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-8895-rom-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-8895-rom-
            ${{ runner.os }}-8895-device-dreamlte-
      - name: Sync sources and compile S8 ROM
        run: bash ci/run-build.sh
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-8895-rom-${{ github.run_id }}
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamlte-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/universal8895-logs/
          retention-days: 14
      - name: Upload validated ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dreamlte-lineage24-${{ github.run_number }}
          path: ${{ runner.temp }}/universal8895-roms/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
